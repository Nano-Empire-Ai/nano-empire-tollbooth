[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-empire-tollbooth"
version = "0.2.2"
description = "Python SDK for HTTP 402 machine paywalls, Base USDC metering, and autonomous agent tollbooths."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Nano Empire AI", email = "rob@nanoempireai.com" },
]
keywords = ["monetize", "python", "decorator", "billing", "micropayment", "agent", "x402", "api", "pay-per-call", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://www.nanoempireai.com"
Documentation = "https://www.nanoempireai.com/llms.txt"
Repository = "https://github.com/Nano-Empire-Ai/nano-empire-tollbooth"
"Issue Tracker" = "https://github.com/Nano-Empire-Ai/nano-empire-tollbooth/issues"
"Offers & Pricing" = "https://www.nanoempireai.com/offers.json"

[tool.setuptools.packages.find]
where = ["."]
include = ["nano_empire_tollbooth*"]

[tool.setuptools.package-data]
nano_empire_tollbooth = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
